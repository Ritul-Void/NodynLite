<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="./styles-web/index.css">
  <title>Nodyn Lite</title>
  <style>
  
    .sidebar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 280px;

      height: 100vh;
      overflow: hidden;
      z-index: 1;
  
    }

    .gradient-wrap {
      overflow: hidden;
      width: 100%;
      height: 100%;
      position: absolute;
      z-index: -1;
      backdrop-filter: blur(12px);
      background: #000000ad;
    }

    .meshgradient>.color {
      width: 100%;
      height: 100%;
      position: absolute;
      display: flex;
      align-items: center;
      transform: scale(3) rotate(0deg);
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      margin: auto;
      background-repeat: no-repeat;
      mix-blend-mode: overlay;
    }

    .c1 {
      background: radial-gradient(#ec8123 25%, transparent 50%);
      background-size: 60% 80%;
      background-position: 0 0;
      animation: c1 8s infinite linear;
    }

    .c2 {
      background: radial-gradient(#4f8c83 25%, transparent 50%);
      background-size: 70% 80%;
      background-position: 0 100%;
      animation: c2 10s infinite linear;
    }

    .c3 {
      background: radial-gradient(#4f8c83 25%, transparent 50%);
      background-size: 80% 80%;
      background-position: 50% 0;
      animation: c3 5s infinite linear;
    }

    .c4 {
      background: radial-gradient(#efbdc8 25%, transparent 50%);
      background-size: 80% 80%;
      background-position: 50% 100%;
      animation: c4 6s infinite linear;
    }

    @keyframes c1 {
      50% {
        background-size: 80% 80%;
        background-position: 50% 100%;
        transform: scale(3) rotate(-75deg);
      }
    }

    @keyframes c2 {
      50% {
        background-size: 80% 80%;
        background-position: 50% 0;
        transform: scale(3) rotate(90deg);
      }
    }

    @keyframes c3 {
      50% {
        background-size: 70% 80%;
        background-position: 0 100%;
        transform: scale(3) rotate(8deg);
      }
    }

    @keyframes c4 {
      50% {
        background-position: 0 0;
        transform: scale(3) rotate(-36deg);
      }
    }


    button.glow-border {
      position: relative;
      z-index: 1;


      overflow: hidden;
    }

    /* Rotating conic gradient behind the button */
    button.glow-border::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300%;
   
      height: 500%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: conic-gradient(#ffffff 0deg 30deg, transparent 30deg 360deg);
      z-index: -2;

      animation: rotate 3s linear infinite;
    }

   
    button.glow-border::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      right: 3px;
      bottom: 3px;
      background: #111;
      border-radius: 9px;
      
      z-index: -1;
    }

    @keyframes rotate {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="sidebar">



    <div class="gradient-wrap">
      <div class="meshgradient">
        <div class="color c1"></div>
        <div class="color c2"></div>
        <div class="color c3"></div>
        <div class="color c4"></div>
      </div>
    </div>

    <div class="sidebar-header">Nodyn</div>
    <div class="notes-list" id="notesList"></div>
    <button class="new-note-btn glow-border" id="newNoteBtn">+ New Note</button>
  </div>

  <div class="editor" id="editor">
    <input type="text" id="noteTitle" placeholder="Note Title..." />
    <textarea id="noteContent" placeholder="Start writing..."></textarea>
    <button class="delete-btn" id="deleteNoteBtn">Delete</button>
  </div>

  <script src="./scripts-web/index.js"></script>
</body>

</html>
